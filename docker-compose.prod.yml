services:
  backend:
    build:
      context: ./backend
    container_name: realsuccess_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - db
      - redis
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --lifespan off

  celery:
    build:
      context: ./backend
    container_name: realsuccess_celery
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - media_volume:/app/media
    depends_on:
      - db
      - redis
    command: celery -A config worker --loglevel=info

  celery_beat:
    build:
      context: ./backend
    container_name: realsuccess_celery_beat
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    command: celery -A config beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://api.ourrealsuccess.com/api
        NEXT_PUBLIC_USE_MOCK: "false"
    container_name: realsuccess_frontend
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: realsuccess_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: realsuccess_prod_db
      POSTGRES_USER: realsuccess_admin
      POSTGRES_PASSWORD: Re@lSucc3ss_Db_Pass_2026!

  redis:
    image: redis:7-alpine
    container_name: realsuccess_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    container_name: realsuccess_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend_static:/app/frontend_static:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
